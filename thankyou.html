<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <style>
    /* Body and background styles */
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #00B4DB, #0083B0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
      overflow: hidden;
    }

    /* Container for the message */
    .thank-you-container {
      text-align: center;
      padding: 30px;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 15px;
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
    }

    /* Animated message */
    .thank-you-message {
      font-size: 3rem;
      font-weight: 600;
      animation: fadeInUp 2s ease-out forwards;
      opacity: 0;
    }

    /* Sub-message for a nice touch */
    .sub-message {
      font-size: 1.2rem;
      margin-top: 20px;
      animation: fadeInUp 3s ease-out forwards;
      opacity: 0;
    }

    /* Keyframe for the fade-in-up animation */
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Button to go back to the form */
    .back-button {
      display: inline-block;
      margin-top: 30px;
      padding: 15px 30px;
      background-color: #FF4081;
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: bold;
      box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .back-button:hover {
      background-color: #E91E63;
      transform: translateY(-4px);
    }

  </style>
</head>
<body>

  <div class="thank-you-container">
    <!-- Thank you message with animation -->
    <div class="thank-you-message">Thank You for Your Attention!</div>

    <!-- Sub-message with animation -->
    <div class="sub-message">
      We appreciate your feedback and wish you the best holidays ahead!
    </div>

    <!-- Button to go back to the questionnaire -->
    <a href="Untitled-1.html" class="back-button">Go Back to Questionnaire</a>
  </div>

</body>
</html>
